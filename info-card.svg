<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 450" width="490" height="450">
<defs>
<style>

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .term-title { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
        
        .metric-box { fill: #161b22; rx: 6px; ry: 6px; stroke: #21262d; stroke-width: 1px; }
        .metric-icon { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #3fb950; }
        .metric-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 10px; fill: #8b949e; }
        .metric-val { font-family: 'Fira Code', Consolas, monospace; font-size: 18px; fill: #f0f6fc; font-weight: bold; }
        .metric-sub { font-family: 'Fira Code', Consolas, monospace; font-size: 9px; fill: #6e7681; }
        
        .chart-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #8b949e; }
        .bar-bg { fill: #161b22; rx: 2px; ry: 2px; }
        .bar-fill { fill: #26a641; rx: 2px; ry: 2px; }
        .bar-fill:hover { fill: #39d353; }
        .month-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 9px; fill: #6e7681; text-anchor: middle; }
        
        .anim-group { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
    
</style>
</defs>
<rect width="490" height="450" class="bg" />
<g class="anim-group" style="animation-delay: 0.1s;">
  <circle cx="20" cy="20" r="4.5" class="dot-red" />
  <circle cx="34" cy="20" r="4.5" class="dot-yellow" />
  <circle cx="48" cy="20" r="4.5" class="dot-green" />
  <text x="62" y="24" class="term-title">diwakar@github: ~/stats.asc</text>
</g>
<line x1="10" y1="36" x2="480" y2="36" stroke="#21262d" stroke-width="1" />
<g class="anim-group" style="animation-delay: 0.15s;">
  <rect x="20" y="52" width="215" height="75" class="metric-box" />
  <text x="35" y="70" class="metric-icon">⚡ <tspan class="metric-lbl">Current streak</tspan></text>
  <text x="35" y="98" class="metric-val">1 <tspan class="metric-lbl">day</tspan></text>
  <text x="35" y="114" class="metric-sub">Active GitHub streak</text>
</g>
<g class="anim-group" style="animation-delay: 0.2s;">
  <rect x="255" y="52" width="215" height="75" class="metric-box" />
  <text x="270" y="70" class="metric-icon">🔥 <tspan class="metric-lbl">Longest streak</tspan></text>
  <text x="270" y="98" class="metric-val">5 <tspan class="metric-lbl">days</tspan></text>
  <text x="270" y="114" class="metric-sub">Max consecutive activity</text>
</g>
<g class="anim-group" style="animation-delay: 0.25s;">
  <rect x="20" y="140" width="215" height="75" class="metric-box" />
  <text x="35" y="158" class="metric-icon">📊 <tspan class="metric-lbl">Contributions</tspan></text>
  <text x="35" y="186" class="metric-val">121</text>
  <text x="35" y="202" class="metric-sub">Total contributions in year</text>
</g>
<g class="anim-group" style="animation-delay: 0.3s;">
  <rect x="255" y="140" width="215" height="75" class="metric-box" />
  <text x="270" y="158" class="metric-icon">📈 <tspan class="metric-lbl">1 active day / avg</tspan></text>
  <text x="270" y="186" class="metric-val">20 <tspan class="metric-sub">/ 6.0 daily</tspan></text>
  <text x="270" y="202" class="metric-sub">Active coding breakdown</text>
</g>
<g class="anim-group" style="animation-delay: 0.35s;">
  <text x="20" y="245" class="chart-lbl">📊 contributions / month</text>
  <line x1="20" y1="255" x2="470" y2="255" stroke="#21262d" stroke-width="1" />
  <rect x="30" y="280" width="24" height="130" class="bar-bg" />
  <rect x="30" y="406" width="24" height="4" class="bar-fill"><title>Nov 2025: 0 contributions</title></rect>
  <text x="42" y="426" class="month-lbl">Nov</text>
