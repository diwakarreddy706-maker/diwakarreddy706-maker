<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 490" width="490" height="490">
<defs>
<style>

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .term-title { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
        
        .metric-box { fill: #161b22; rx: 6px; ry: 6px; stroke: #21262d; stroke-width: 1px; }
        .metric-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 10px; fill: #8b949e; }
        .metric-val-green { font-family: 'Fira Code', Consolas, monospace; font-size: 17px; fill: #3fb950; font-weight: bold; }
        .metric-val-white { font-family: 'Fira Code', Consolas, monospace; font-size: 17px; fill: #f0f6fc; font-weight: bold; }
        .metric-sub { font-family: 'Fira Code', Consolas, monospace; font-size: 9px; fill: #6e7681; }
        
        .chart-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #8b949e; }
        .bar-bg { fill: #161b22; rx: 2px; ry: 2px; }
        .bar-fill { fill: #26a641; rx: 2px; ry: 2px; }
        .bar-fill:hover { fill: #39d353; }
        .month-lbl { font-family: 'Fira Code', Consolas, monospace; font-size: 9px; fill: #6e7681; text-anchor: middle; }
        
        .anim-group { animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
    
</style>
</defs>
<rect width="490" height="490" class="bg" />
<g class="anim-group" style="animation-delay: 0.1s;">
  <circle cx="20" cy="20" r="4.5" class="dot-red" />
  <circle cx="34" cy="20" r="4.5" class="dot-yellow" />
  <circle cx="48" cy="20" r="4.5" class="dot-green" />
  <text x="62" y="24" class="term-title">diwakar@github: ~$ ./stats.sh</text>
</g>
<line x1="10" y1="36" x2="480" y2="36" stroke="#21262d" stroke-width="1" />
<g class="anim-group" style="animation-delay: 0.15s;">
  <rect x="20" y="48" width="215" height="58" class="metric-box" />
  <text x="32" y="64" class="metric-lbl">$ current streak</text>
  <text x="32" y="84" class="metric-val-green">1 <tspan class="metric-lbl">days</tspan></text>
  <text x="32" y="97" class="metric-sub">Oct 8</text>
</g>
<g class="anim-group" style="animation-delay: 0.2s;">
  <rect x="255" y="48" width="215" height="58" class="metric-box" />
  <text x="267" y="64" class="metric-lbl">$ longest streak</text>
  <text x="267" y="84" class="metric-val-white">5 <tspan class="metric-lbl">days</tspan></text>
  <text x="267" y="97" class="metric-sub">Sep 28 - Oct 2</text>
</g>
<g class="anim-group" style="animation-delay: 0.25s;">
  <rect x="20" y="114" width="215" height="58" class="metric-box" />
  <text x="32" y="130" class="metric-lbl">$ contributions</text>
  <text x="32" y="150" class="metric-val-white">127</text>
  <text x="32" y="163" class="metric-sub">in the last year</text>
</g>
<g class="anim-group" style="animation-delay: 0.3s;">
  <rect x="255" y="114" width="215" height="58" class="metric-box" />
  <text x="267" y="130" class="metric-lbl">$ active days</text>
  <text x="267" y="150" class="metric-val-white">20 <tspan class="metric-sub">/ 365</tspan></text>
  <text x="267" y="163" class="metric-sub">5% of the year</text>
</g>
<g class="anim-group" style="animation-delay: 0.35s;">
  <rect x="20" y="180" width="215" height="58" class="metric-box" />
  <text x="32" y="196" class="metric-lbl">$ best day</text>
  <text x="32" y="216" class="metric-val-white">18</text>
  <text x="32" y="229" class="metric-sub">2026-08-31</text>
</g>
<g class="anim-group" style="animation-delay: 0.4s;">
  <rect x="255" y="180" width="215" height="58" class="metric-box" />
  <text x="267" y="196" class="metric-lbl">$ avg / active day</text>
  <text x="267" y="216" class="metric-val-white">6.3</text>
  <text x="267" y="229" class="metric-sub">contributions</text>
</g>
<g class="anim-group" style="animation-delay: 0.45s;">
  <text x="20" y="260" class="chart-lbl">📊 contributions / month</text>
  <line x1="20" y1="268" x2="470" y2="268" stroke="#21262d" stroke-width="1" />
  <rect x="30" y="300" width="24" height="150" class="bar-bg" />
  <rect x="30" y="446" width="24" height="4" class="bar-fill"><title>Nov 2025: 0 contributions</title></rect>
  <text x="42" y="466" class="month-lbl">N</text>
  <rect x="66" y="300" width="24" height="150" class="bar-bg" />
  <rect x="66" y="446" width="24" height="4" class="bar-fill"><title>Dec 2025: 0 contributions</title></rect>
  <text x="78" y="466" class="month-lbl">D</text>
