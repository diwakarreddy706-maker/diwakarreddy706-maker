  <rect x="354" y="339" width="24" height="111" class="bar-fill"><title>Aug 2026: 47 contributions</title></rect>
  <text x="366" y="466" class="month-lbl">A</text>
  <rect x="390" y="300" width="24" height="150" class="bar-bg" />
  <rect x="390" y="300" width="24" height="150" class="bar-fill"><title>Sep 2026: 63 contributions</title></rect>
  <text x="402" y="466" class="month-lbl">S</text>
  <rect x="426" y="300" width="24" height="150" class="bar-bg" />
