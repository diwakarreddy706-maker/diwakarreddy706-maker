  <circle cx="35" cy="22" r="5" class="dot-yellow" />
  <circle cx="50" cy="22" r="5" class="dot-green" />
  <text x="65" y="26" class="term-title">diwakarr@github: ~/neofetch</text>
</g>
<line x1="12" y1="38" x2="478" y2="38" stroke="#21262d" stroke-width="1" />
<g class="anim-header" style="animation-delay: 0.1s;">
