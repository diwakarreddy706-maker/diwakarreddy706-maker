<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 450" width="370" height="450">
<defs>
<style>

        @keyframes printRow {
            0% { opacity: 0; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
        .dot-red { fill: #ff5f56; }
        .dot-yellow { fill: #ffbd2e; }
        .dot-green { fill: #27c93f; }
        .term-title { font-family: 'Fira Code', Consolas, 'Courier New', monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
        .ascii-text {
            font-family: 'Fira Code', Consolas, 'Courier New', monospace;
            font-size: 10px;
            fill: #3fb950;
            white-space: pre;
        }
        .ascii-row {
            animation: printRow 0.15s ease-out forwards;
            opacity: 0;
        }
    
</style>
</defs>
<rect width="370" height="450" class="bg" />
