    <style> .row-8 { animation: showRow_8 10.0s ease-out infinite; } </style>
    <text x="0" y="80.5" class="row-7">:##%%%#*%#.&#160;&#160;&#160;.:::&#160;&#160;&#160;&#160;=#*###=+%*+=*%**==</text>
    <style> .row-9 { animation: showRow_9 10.0s ease-out infinite; } </style>
    <text x="0" y="92.0" class="row-8">:*=#%%%%%%#.&#160;.=-:::&#160;&#160;&#160;.#*##*-=@**=#%#%*+</text>
    <style> .row-10 { animation: showRow_10 10.0s ease-out infinite; } </style>
    <text x="0" y="103.5" class="row-9">%#+*++***+*=:.-=-+*.=::#*##*-=%*+=*%+%%*</text>
    <style> .row-11 { animation: showRow_11 10.0s ease-out infinite; } </style>
    <text x="0" y="115.0" class="row-10">*##********+&#160;&#160;:=-&#160;&#160;&#160;.&#160;.****###@##*%%%@@@</text>
    <style> .row-12 { animation: showRow_12 10.0s ease-out infinite; } </style>
    <text x="0" y="126.5" class="row-11">***#*****%%#=&#160;&#160;..&#160;&#160;::--****##**%%##%*%%%</text>
    <style> .row-13 { animation: showRow_13 10.0s ease-out infinite; } </style>
    <text x="0" y="138.0" class="row-12">=+******#@@%#+=.&#160;.+*##+-=+*#*+###+*%#%%#</text>
    <style> .row-14 { animation: showRow_14 10.0s ease-out infinite; } </style>
    <text x="0" y="149.5" class="row-13">=*+*+++%@%%@%*=&#160;&#160;.:##+%#**+++-==+-+%#@##</text>
    <style> .row-15 { animation: showRow_15 10.0s ease-out infinite; } </style>
    <text x="0" y="161.0" class="row-14">===+==+%%%@%%*.&#160;&#160;-++++#%@@%#+=*--.+%*%#%</text>
    <style> .row-16 { animation: showRow_16 10.0s ease-out infinite; } </style>
    <text x="0" y="172.5" class="row-15">.:-+++*%@@%%@*::-**+++##%%@@#+#=+=*%*%##</text>
    <style> .row-17 { animation: showRow_17 10.0s ease-out infinite; } </style>
    <text x="0" y="184.0" class="row-16">:::-*****++**-.-+++++-*#@%@%%***=-#%#%**</text>
    <style> .row-18 { animation: showRow_18 10.0s ease-out infinite; } </style>
    <text x="0" y="195.5" class="row-17">....&#160;.:...&#160;.:=:-=+#+-:=%@%%@%*+=+*%%*@##</text>
    <style> .row-19 { animation: showRow_19 10.0s ease-out infinite; } </style>
    <text x="0" y="207.0" class="row-18">..----.&#160;&#160;&#160;&#160;&#160;.:-==+%#+:=@%@@%@*==##%%##+#</text>
    <style> .row-20 { animation: showRow_20 10.0s ease-out infinite; } </style>
    <text x="0" y="218.5" class="row-19">.&#160;&#160;.:*%####*==++=*#*+=#@@%%%@*-*+.*%+*--</text>
    <style> .row-21 { animation: showRow_21 10.0s ease-out infinite; } </style>
    <text x="0" y="230.0" class="row-20">&#160;.:-.-@@@@@#-=++=*%#+-*#%%%%@+-#*-*%*%*=</text>
    <style> .row-22 { animation: showRow_22 10.0s ease-out infinite; } </style>
    <text x="0" y="241.5" class="row-21">-=++*%%@%%%=-+*+-####-*%%%@%@%%%%%%%#%%*</text>
    <style> .row-23 { animation: showRow_23 10.0s ease-out infinite; } </style>
    <text x="0" y="253.0" class="row-22">*##+%@@%#@*:=**+-#%%*=*#%%%@@%@%##%@%%#*</text>
    <style> .row-24 { animation: showRow_24 10.0s ease-out infinite; } </style>
    <text x="0" y="264.5" class="row-23">#*+%%%@%%@*:=**==%#*+*%*##%%%%%%@%%%@@%#</text>
    <style> .row-25 { animation: showRow_25 10.0s ease-out infinite; } </style>
    <text x="0" y="276.0" class="row-24">%##%%%#+%#++*#*==###*+**#***%%#+#%%%%%@@</text>
    <text x="0" y="287.5" class="row-25">-#%#%%#+%#.-*=-&#160;:++##*++=+*%%%%##%%%#%%%</text>
  </g>
  <g transform="translate(14, 95)">
    <rect x="0" y="0" width="342" height="12" fill="url(#laserGrad)" class="laser-beam" />
  </g>
  <rect x="12" y="90" width="346" height="315" fill="url(#scanlines)" pointer-events="none" />
  <line x1="10" y1="412" x2="360" y2="412" stroke="#21262d" stroke-width="1" />
  <g transform="translate(18, 430)">
    <text x="0" y="0" class="footer-txt">STATUS: <tspan class="status-online">ONLINE</tspan></text>
    <text x="140" y="0" class="footer-txt">RENDER: 100%</text>
    <rect x="240" y="-9" width="7" height="11" class="blink-cursor" />
  </g>
</g>
</svg>